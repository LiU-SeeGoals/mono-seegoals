syntax = "proto2";

// Vendored from RoboCup-SSL/ssl-game-controller proto/ (master 0b8f752808,
// 2026-11-23); only import paths and go_package changed.
option go_package = "github.com/LiU-SeeGoals/proto_go/gc";

// Team is either blue or yellow
enum Team {
    // team not set
    UNKNOWN = 0;
    // yellow team
    YELLOW = 1;
    // blue team
    BLUE = 2;
}

// RobotId is the combination of a team and a robot id
message RobotId {
    // the robot number
    optional uint32 id = 1;
    // the team that the robot belongs to
    optional Team team = 2;
}

// Division denotes the current division, which influences some rules
enum Division {
    DIV_UNKNOWN = 0;
    DIV_A = 1;
    DIV_B = 2;
}
