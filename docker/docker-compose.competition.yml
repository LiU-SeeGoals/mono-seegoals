services:
  ai:
    environment:
      - ENVIRONMENT=competition
      - VITE_AI_GAME_VIEWER_SOCKET_ADDR=127.0.0.1
    network_mode: host

  game-viewer:
    environment:
      - ENVIRONMENT=competition
      - SSL_VISION_MULTICAST_PORT=${SSL_VISION_REAL_MAIN_PORT}
      - VITE_AI_GAME_VIEWER_SOCKET_ADDR=127.0.0.1
    command: bash -c "cd /var/GameViewer && pnpm install && pnpm run dev"
    network_mode: host

  ssl-vision-client:
    command:
      - "-visionAddress"
      - "${SSL_VISION_MULTICAST_ADDR}:${SSL_VISION_REAL_MAIN_PORT}"
    network_mode: host

  ssl-game-controller:
    profiles:
      - donotstart

  er-sim:
    profiles:
      - donotstart

  tiger-auto-referee:
    profiles:
      - donotstart
